# The hosted demo (ADR-035). Secrets -- DATABASE_URL, the realtime secrets, S3_*, the two
# agent device tokens -- are set with `fly secrets set`, never written here.
app = "stellar-demo"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DARKVIEW_DEPLOYMENT = "demo"
  REALTIME_PORT = "4001"
  DEMO_AGENT_OBSERVATORY_ID = "00000000-0000-4000-8000-000000000010"
  DEMO_NIGHT_OBSERVATORY_ID = "00000000-0000-4000-8000-000000000040"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on (2026-10-25): a sleeping machine made the first visit after a quiet spell
  # wait seconds for a cold boot, and every web page waits on this API. One
  # shared-cpu-1x machine stays up; the agents and realtime's sweeps keep running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  # Answered by Caddy only once realtime is listening (Caddyfile, start.sh). A machine
  # whose realtime never came up, or whose front is wedged, fails this and is replaced
  # instead of sitting there "started" and serving nothing.
  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
