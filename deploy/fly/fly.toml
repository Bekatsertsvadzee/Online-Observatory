# The hosted demo (ADR-035). Secrets -- DATABASE_URL, the realtime secrets, S3_*, the two
# agent device tokens -- are set with `fly secrets set`, never written here.
app = "stellar-demo"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DARKVIEW_DEPLOYMENT = "demo"
  REALTIME_PORT = "4001"
  DEMO_AGENT_OBSERVATORY_ID = "00000000-0000-4000-8000-000000000010"
  DEMO_NIGHT_OBSERVATORY_ID = "00000000-0000-4000-8000-000000000040"

[http_service]
  internal_port = 8080
  force_https = true
  # Free-tier start (Nika, 2026-10-08): the machine sleeps when no visitor holds a
  # connection through Fly's proxy and wakes on the next request. The agents' link is
  # loopback, so it does not keep the machine up; while it sleeps the observatories
  # read offline and realtime's sweeps do not run. The agents still live in a
  # long-lived process, not a serverless function. For an always-on demo set
  # auto_stop_machines = "off" and min_machines_running = 1.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
