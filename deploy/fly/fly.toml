# The hosted demo (ADR-035). Secrets -- DATABASE_URL, the realtime secrets, S3_*, the two
# agent device tokens -- are set with `fly secrets set`, never written here.
app = "stellar-demo"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DARKVIEW_DEPLOYMENT = "demo"
  REALTIME_PORT = "4001"
  DEMO_AGENT_OBSERVATORY_ID = "00000000-0000-4000-8000-000000000010"
  DEMO_NIGHT_OBSERVATORY_ID = "00000000-0000-4000-8000-000000000040"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the agents hold the observatory link, and CLAUDE.md forbids holding
  # it anywhere that sleeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
