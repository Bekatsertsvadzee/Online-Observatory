name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # DV-055 proves that a partial unique index, not application logic, is what
    # stops two people booking the same half hour. That claim can only be tested
    # against a real database, so CI runs one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darkview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      # The Pydantic half of the contract is generated by a Python tool, so the
      # agent environment must exist before the drift check can run.
      - name: Agent tooling
        run: |
          python3.12 -m venv agent/.venv
          agent/.venv/bin/pip install --quiet -r agent/requirements-dev.txt

      # contracts/openapi.yaml is the single source of truth. This fails the build
      # if any committed generated artifact no longer matches the spec.
      - name: Contract drift
        run: npm run contracts:check

      - name: Lint
        run: npm run lint

      - name: Lint (agent)
        run: agent/.venv/bin/ruff check agent

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Applies every migration to an empty database, then runs the reservation
      # concurrency proof against it: N=20 for one slot, and the same race again
      # with the index dropped, which must double-book.
      - name: Integration tests (PostgreSQL)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/darkview_test
          DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/darkview_test
        run: npm run test:integration

      # The agent never commands real hardware in CI. The simulator is the
      # default implementation and these tests run against it, always.
      - name: Unit tests (agent)
        working-directory: agent
        run: ../agent/.venv/bin/python -m pytest

      - name: Build
        run: npm run build
