name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: npm ci

      # The Pydantic half of the contract is generated by a Python tool, so the
      # agent environment must exist before the drift check can run.
      - name: Agent tooling
        run: |
          python3.12 -m venv agent/.venv
          agent/.venv/bin/pip install --quiet -r agent/requirements-dev.txt

      # contracts/openapi.yaml is the single source of truth. This fails the build
      # if any committed generated artifact no longer matches the spec.
      - name: Contract drift
        run: npm run contracts:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
